services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calliope
      POSTGRES_PASSWORD: calliope
      POSTGRES_DB: calliope
    ports:
      - "5432:5432"
    volumes:
      - calliope_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calliope -d calliope"]
      interval: 3s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - calliope_ollama:/root/.ollama

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      ssh:
        - default
    environment:
      DATABASE_URL: postgresql+asyncpg://calliope:calliope@postgres:5432/calliope
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: mistral
      AAMATI_ROOT: /opt/Aamati/aamati_ml
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-ollama}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-claude-3-5-haiku-20241022}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-meta-llama/llama-3.1-8b-instruct}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - calliope_audio:/data/audio

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  calliope_pg:
  calliope_ollama:
  calliope_audio:
