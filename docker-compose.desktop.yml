services:
  postgres:
    image: postgres:16
    container_name: calliope-postgres
    environment:
      POSTGRES_USER: calliope
      POSTGRES_PASSWORD: calliope
      POSTGRES_DB: calliope
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calliope -d calliope"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/team-deepiri/calliope-api:${CALLIOPE_API_TAG:-latest}
    container_name: calliope-api
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://calliope:calliope@postgres:5432/calliope
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:9b}
      DATA_PATH: /data
      AUDIO_STORAGE_PATH: /data/audio
      RECORDINGS_PATH: /data/audio/recordings
      PROCESSED_PATH: /data/audio/processed
      EXPORTS_PATH: /data/audio/exports
      SAMPLES_PATH: /data/audio/samples
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/audio:/data/audio
