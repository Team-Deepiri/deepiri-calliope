services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: calliope
      POSTGRES_PASSWORD: calliope
      POSTGRES_DB: calliope
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calliope -d calliope"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/team-deepiri/calliope-api:${CALLIOPE_API_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_URL: postgresql+asyncpg://calliope:calliope@postgres:5432/calliope
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://tauri.localhost,http://tauri.localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/audio:/data/audio
