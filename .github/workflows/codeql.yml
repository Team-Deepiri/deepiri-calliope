name: CodeQL

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    timeout-minutes: 20
    name: Analyze (python, javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: CodeQL gate
        run: |
          echo "CodeQL scanning is disabled until GitHub Advanced Security / code scanning is enabled for this repository."
          echo "Re-enable the github/codeql-action steps in .github/workflows/codeql.yml after GHAS is turned on."
          exit 0
