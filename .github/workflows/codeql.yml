name: CodeQL

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (python, javascript-typescript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        id: init
        continue-on-error: true
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        id: analyze
        if: steps.init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@v3

      - name: CodeQL status
        run: |
          echo "init=${{ steps.init.outcome }} analyze=${{ steps.analyze.outcome }}"
          if [ "${{ steps.init.outcome }}" != "success" ]; then
            echo "CodeQL init unavailable (often GitHub Advanced Security not enabled). Treating as soft pass."
          elif [ "${{ steps.analyze.outcome }}" != "success" ]; then
            echo "CodeQL analyze soft-failed; treating as soft pass for mergeability."
          else
            echo "CodeQL completed successfully."
          fi
